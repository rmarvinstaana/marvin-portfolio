<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>OG Image</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #FFFFF0;      /* ivory */
      --ink: #141414;     /* primary text */
      --accent: #C05F0E;  /* burnt amber */
      --muted: #6B6B66;   /* secondary text */
      --line: #E7E5E0;    /* hairline */
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 1200px; height: 630px; }
    body {
      background-color: var(--bg);
      color: var(--ink);
      font-family: 'Space Grotesk', sans-serif;
      position: relative;
      overflow: hidden;
    }
    /* Faint hairline grid, fading toward the bottom */
    .grid {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(var(--line) 1px, transparent 1px),
        linear-gradient(90deg, var(--line) 1px, transparent 1px);
      background-size: 56px 56px;
      -webkit-mask-image: linear-gradient(to bottom, #000 0%, #000 40%, transparent 90%);
      mask-image: linear-gradient(to bottom, #000 0%, #000 40%, transparent 90%);
      opacity: 0.7;
    }
    .content {
      position: relative;
      z-index: 1;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 0 96px;
    }
    .eyebrow {
      display: flex;
      align-items: center;
      gap: 16px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 20px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 28px;
    }
    .eyebrow::before {
      content: '';
      width: 44px;
      height: 2px;
      background: var(--accent);
    }
    .name {
      font-size: 116px;
      font-weight: 700;
      line-height: 1.02;
      letter-spacing: -0.02em;
      color: var(--ink);
    }
    /* Single burnt-amber rule */
    .rule {
      width: 120px;
      height: 4px;
      background: var(--accent);
      border-radius: 2px;
      margin: 36px 0;
    }
    .role {
      font-family: 'JetBrains Mono', monospace;
      font-size: 34px;
      font-weight: 500;
      color: var(--ink);
      letter-spacing: 0.01em;
    }
    .foot {
      position: absolute;
      bottom: 48px;
      left: 96px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 20px;
      color: var(--muted);
      letter-spacing: 0.04em;
    }
  </style>
</head>
<body>
  <div class="grid"></div>
  <div class="content">
    <div class="eyebrow">Portfolio</div>
    <div class="name">Marvin Sta. Ana</div>
    <div class="rule"></div>
    <div class="role">Head of Content · mb.io (MultiBank Group)</div>
  </div>
  <div class="foot">FX/CFD · Crypto · Web3 · Dubai</div>
</body>
</html>
